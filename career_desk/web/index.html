<section class="panel"><div class="panelhead"><h2>申请工作台</h2></div><div class="workTabs" role="tablist" aria-label="申请地区"><button id="cnTab" class="tab active" role="tab" aria-selected="true">全部国内申请记录</button><button id="usTab" class="tab" role="tab" aria-selected="false">全部美国申请记录</button></div><section id="domesticHistory" class="historyBody"><p id="marketMetrics" class="muted"></p><div class="historyTools"><input id="historySearch" type="search" aria-label="搜索申请记录" placeholder="搜索公司、岗位或岗位编号…"><div class="statusSelect"><select id="historyFilter" aria-label="筛选投递状态"><option value="all">全部记录</option><option value="submitted">已提交</option><option value="attention">待处理</option><option value="excluded">已排除</option></select><svg class="statusChevron" viewBox="0 0 16 16" aria-hidden="true" fill="none"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><button id="exportHistory" class="exportButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V3m-4 4 4-4 4 4M4 13v7h16v-7"/></svg>导出</button></div><div class="row spaced"><span id="historyCount" class="muted">正在载入国内记录…</span></div><div id="historyRecords"></div><div class="row spaced" id="historyPages"></div></section></section></div><div id="campaignPolicy">正在载入你的资料…</div></main><div id="toast" role="status"></div>
<script>

const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let market='CN',markets={},marketVersions={},domesticRecords=[],filteredRecords=[],historyPage=1,historySignature='',pendingSignature='',loading=false,healthLoading=false;
const historyLabels={submitted:'已提交',attention:'待处理',active:'待处理',excluded:'已排除',historical:'已排除',closed:'已排除'};
async function api(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('暂时无法更新');return r.json()}
function timestamp(value){if(!value)return '未记录';if(/^\d{4}-\d{2}-\d{2}$/.test(value))return value.replaceAll('-','/');let d=new Date(typeof value==='number'?value*1000:value);return isNaN(d.getTime())?'未记录':d.toLocaleString('zh-CN',{hour12:false})}
function safeURL(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?v:''}catch(e){return ''}}
function friendly(model){return model.replace(/^qwen/i,'千问 Qwen').replace(/^gemma/i,'Gemma')}
async function health(){if(healthLoading)return;healthLoading=true;try{let h=await api('/api/health'),names=h.models||[],display=names.length?names:h.selected?[h.selected]:[],ready=display.length&&display.every(m=>(h.loaded||[]).includes(m));$('model').textContent=h.online?(display.length?display.map(friendly).join('、'):'本地模型服务在线'):'本地模型服务未连接';$('model').className=h.online?'dot':'';$('modelInfo').textContent=!h.online?'稍后自动重试':h.busy?'正在处理请求':ready?'已加载，随时可用'+(h.selected&&!display.includes(h.selected)?' · Ollama App 已选择 '+friendly(h.selected):''):display.length?'已选择，使用时自动加载':'等待调用模型'}catch(e){$('model').textContent='○ 暂时无法读取模型状态';$('modelInfo').textContent='稍后自动重试'}finally{healthLoading=false}}
const pendingRequestTimes=new Map(),pendingFirstSeen=new Map(),pendingFetching=new Set();let pendingInitialized=false,latestPending=[];
function pendingKey(q){return `${q.market||''}:${q.task_id||''}:${q.id}`}
function pendingMillis(value){if(value==null||value==='')return 0;const number=Number(value);if(Number.isFinite(number)&&number>0)return number<1e12?number*1000:number;return Date.parse(value)||0}
function pendingTime(q){const record=(markets[q.market||'CN']?.records||[]).find(r=>String(r.id)===String(q.id)||q.task_id&&r.task_id===q.task_id);return pendingMillis(q.updated||q.created)||pendingRequestTimes.get(`${q.task_id}:${q.id}`)||Math.max(pendingMillis(record?.updated||record?.created),pendingFirstSeen.get(pendingKey(q))||0)}
function renderPending(items){latestPending=items;const now=Date.now();for(const q of items){const key=pendingKey(q);if(!pendingFirstSeen.has(key))pendingFirstSeen.set(key,pendingInitialized?now:0)}pendingInitialized=true;
const currentKeys=new Set(items.map(pendingKey));for(const key of pendingFirstSeen.keys())if(!currentKeys.has(key))pendingFirstSeen.delete(key);
const sorted=items.slice().sort((a,b)=>pendingTime(b)-pendingTime(a));const sig=JSON.stringify(sorted.map(q=>({...q,_order:pendingTime(q)})));
if(sig!==pendingSignature){pendingSignature=sig;$('pending').textContent=sorted.length?sorted.length+' 项':'暂无待确认事项';$('pendingList').innerHTML=sorted.length?'<ul class="pendingList">'+sorted.map(q=>`<li><b>${q.market==='US'?'美国 · ':''}${escape(q.company)} · ${escape(q.role)}</b><p>${escape(q.question||q.label)}</p></li>`).join('')+'</ul>':'';$('pendingList').scrollTop=0;}
// Read original question creation times once; no task state is modified.
const tasks=new Set(items.filter(q=>q.task_id&&!pendingRequestTimes.has(`${q.task_id}:${q.id}`)).map(q=>q.task_id));
for(const task of tasks){if(pendingFetching.has(task))continue;pendingFetching.add(task);api('/api/tasks/'+encodeURIComponent(task)).then(d=>{for(const q of d.requests||[])pendingRequestTimes.set(`${task}:${q.id}`,pendingMillis(q.created));for(const q of latestPending.filter(q=>q.task_id===task))if(!pendingRequestTimes.has(`${task}:${q.id}`))pendingRequestTimes.set(`${task}:${q.id}`,0);renderPending(latestPending)}).catch(()=>{}).finally(()=>pendingFetching.delete(task));}
const activeRequests=new Set(items.map(q=>`${q.task_id}:${q.id}`));for(const key of pendingRequestTimes.keys())if(!activeRequests.has(key))pendingRequestTimes.delete(key);
}
function renderHistory(){let opened=new Set([...$('historyRecords').querySelectorAll('details[open]')].map(n=>n.dataset.record)),scroll=$('historyRecords').scrollTop;let q=$('historySearch').value.trim().toLocaleLowerCase(),state=$('historyFilter').value;filteredRecords=domesticRecords.filter(r=>(state==='all'||(state==='attention'?['attention','active'].includes(r.status):state==='excluded'?['excluded','closed'].includes(r.status):r.status===state))&&(!q||[r.company,r.role,...r.job_ids].join(' ').toLocaleLowerCase().includes(q)));let pages=Math.max(1,Math.ceil(filteredRecords.length/15));historyPage=Math.min(historyPage,pages);$('historyCount').textContent=state==='all'&&!q?`${domesticRecords.length} 条记录`:`${filteredRecords.length} 条记录 · 共 ${domesticRecords.length} 条`;
$('historyRecords').innerHTML=filteredRecords.slice((historyPage-1)*15,historyPage*15).map(r=>`<details class="historyItem" data-record="${escape(r.id)}" ${opened.has(r.id)?'open':''}><summary><b class="historyCompany">${escape(r.company)}</b><div class="historyRole">${escape(r.role)}</div><span class="badge recordStatus ${escape(r.status)}">${escape(r.status_label||historyLabels[r.status]||r.status)}</span></summary><div class="historyEvidence">${r.location?`<div class="muted">${escape(r.location)}</div>`:''}${r.job_ids.length?`<div class="muted">岗位编号 ${escape(r.job_ids.join(' / '))}</div>`:''}${r.applied_at?`<div class="muted">投递时间 ${escape(timestamp(r.applied_at))}</div>`:''}${r.evidence.length?`<p>${r.evidence.map(escape).join('<br>')}</p>`:''}${safeURL(r.url)?`<a href="${escape(safeURL(r.url))}" target="_blank" rel="noreferrer">查看岗位 ↗</a>`:''}${r.task_id?`<div data-files="${escape(r.task_id)}"></div>`:''}</div></details>`).join('')||'<div class="empty">没有符合条件的记录</div>';
$('historyRecords').scrollTop=scroll;$('historyPages').innerHTML=`<button type="button" class="secondary" id="historyPrev" ${historyPage<=1?'disabled':''}>上一页</button><span class="muted">${historyPage} / ${pages}</span><button type="button" class="secondary" id="historyNext" ${historyPage>=pages?'disabled':''}>下一页</button>`;$('historyPrev').onclick=()=>{historyPage--;renderHistory()};$('historyNext').onclick=()=>{historyPage++;renderHistory()};
$('historyRecords').querySelectorAll('details').forEach(n=>{n.ontoggle=()=>{if(n.open)loadFiles(n)};if(n.open)loadFiles(n)})}
async function loadFiles(n){let box=n.querySelector('[data-files]');if(!box||box.dataset.loaded)return;box.dataset.loaded='yes';try{let d=await api('/api/tasks/'+encodeURIComponent(box.dataset.files));box.innerHTML=(d.files||[]).filter(f=>/cover-letter|materials|quality-review|application-materials/.test(f.name)).map(f=>`<a href="${escape(f.url)}" target="_blank" rel="noreferrer">${escape(f.name)}</a>`).join('')}catch(e){delete box.dataset.loaded}}
function selectMarket(next){market=next;historyPage=1;historySignature='';$('historySearch').value='';$('historyFilter').value='all';updateMarket()}
function updateMarket(){let d=markets[market];if(!d)return;$('cnTab').classList.toggle('active',market==='CN');$('usTab').classList.toggle('active',market==='US');$('cnTab').setAttribute('aria-selected',market==='CN');$('usTab').setAttribute('aria-selected',market==='US');let sig=JSON.stringify(d);if(sig!==historySignature){historySignature=sig;domesticRecords=d.records;renderHistory()}let s=d.summary;$('marketMetrics').textContent=market==='CN'?`已提交 ${s.submitted} · 待处理 ${s.attention+(s.active||0)} · 已排除 ${s.excluded}`:`已提交 ${s.submitted} · 待处理 ${s.attention} · 已排除 ${s.excluded+(s.closed||0)}`}
async function refresh(){if(loading)return;loading=true;try{let d=await api('/api/workspace');markets={CN:d.domestic,US:d.us};$('count').textContent=`国内 ${d.domestic.summary.total} · 美国 ${d.us.summary.total}`;$('metrics').replaceChildren(...[['国内',d.domestic.summary],['美国',d.us.summary]].map(([name,s])=>{let line=document.createElement('div');line.textContent=`${name}：已提交 ${s.submitted} · 待处理 ${s.attention+(s.active||0)} · 已排除 ${s.excluded+(s.closed||0)}`;return line}));$('cnTab').textContent=`全部国内申请记录 ${d.domestic.summary.total}`;$('usTab').textContent=`全部美国申请记录 ${d.us.summary.total}`;$('campaignPolicy').textContent=`已保存 ${d.facts_count} 条求职资料 · 国内已确认 ${d.confirmed_count} 项 · 美国已确认 ${d.us_confirmed_count} 项`;renderPending(d.pending);updateMarket();$('syncStatus').textContent=d.us.sync?.healthy===false?'美国记录暂时无法同步，已保留上次内容':'每秒更新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch(e){$('syncStatus').textContent='更新暂时中断，正在重试'}finally{loading=false}}
$('cnTab').onclick=()=>selectMarket('CN');$('usTab').onclick=()=>selectMarket('US');

$('historySearch').oninput=()=>{historyPage=1;renderHistory()};$('historyFilter').onchange=()=>{historyPage=1;renderHistory()};
$('exportHistory').onclick=()=>{const safe=v=>{v=String(v??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'};let rows=[['公司','岗位','岗位编号','状态','说明'],...filteredRecords.map(r=>[r.company,r.role,r.job_ids.join(' / '),r.status_label||historyLabels[r.status],r.evidence.join('；')])];let u=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(row=>row.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download=market==='CN'?'国内求职记录.csv':'美国求职记录.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
